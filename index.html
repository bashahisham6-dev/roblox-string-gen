    <title>Roblox 64 - Image String Converter</title>

<body>

<div class="box">
    <h3>Roblox 64</h3>

    <div class="control-group">
        <label for="sizePicker">Resolution (width):</label>
        <select id="sizePicker">
            <option value="32">32 pixels wide (low resolution)</option>
            <option value="64" selected>64 pixels wide (normal)</option>
            <option value="128">128 pixels wide (medium)</option>
            <option value="256">256 pixels wide (high)</option>
            <option value="512">512 pixels wide (highest)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="imageInput">Upload picture:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <div id="imageInfo">No image selected.</div>

    <textarea
        id="output"
        placeholder="Your formatted string will appear here..."
        readonly
    ></textarea>

    <button id="copyBtn">Copy string</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const sizePicker = document.getElementById('sizePicker');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');
    const imageInfo = document.getElementById('imageInfo');

    let originalImage = null;

    function processImage() {
        const file = imageInput.files[0];

        if (!file) {
            originalImage = null;
            output.value = '';
            imageInfo.textContent = 'No image selected.';
            return;
        }

        const reader = new FileReader();

        reader.onload = function(event) {
            const img = new Image();

            img.onload = function() {
                originalImage = img;
                generateString();
            };

            img.onerror = function() {
                originalImage = null;
                output.value = '';
                imageInfo.textContent = 'Could not load this image.';
            };

            img.src = event.target.result;
        };

        reader.onerror = function() {
            output.value = '';
            imageInfo.textContent = 'Could not read this file.';
        };

        reader.readAsDataURL(file);
    }

    function generateString() {
        if (!originalImage) return;

        const width = parseInt(sizePicker.value, 10);

        // Preserve the original image's aspect ratio.
        const aspectRatio = originalImage.height / originalImage.width;
        const height = Math.max(1, Math.round(width * aspectRatio));

        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');

        canvas.width = width;
        canvas.height = height;

        // Scale the image without stretching or squashing it.
        ctx.drawImage(originalImage, 0, 0, width, height);

        const imgData = ctx.getImageData(
            0, 0, width, height
        ).data;

        const pixelStrings = [];

        // Extract RGB values from every pixel, row by row.
        for (let i = 0; i < imgData.length; i += 4) {
            const r = imgData[i];
            const g = imgData[i + 1];
            const b = imgData[i + 2];

            pixelStrings.push(`${r},${g},${b}`);
        }

        // Format: WIDTHxHEIGHT|R,G,B;R,G,B;...
        output.value = `${width}x${height}|` +
            pixelStrings.join(';');

        imageInfo.textContent =
            `Original: ${originalImage.width} × ${originalImage.height}` +
            ` | Output: ${width} × ${height}` +
            ` | Pixels: ${width * height}`;
    }

    imageInput.addEventListener('change', processImage);

    // Regenerate the string when the width changes.
    sizePicker.addEventListener('change', generateString);

    copyBtn.addEventListener('click', async function() {
        if (!output.value) {
            alert('Please upload an image first.');
            return;
        }

        try {
            await navigator.clipboard.writeText(output.value);
            alert('String copied!');
        } catch (error) {
            // Fallback for browsers where clipboard access is unavailable.
            output.select();
            const copied = document.execCommand('copy');

            if (copied) {
                alert('String copied!');
            } else {
                alert('Copy failed. Please copy the selected text manually.');
            }
        }
    });
</script>

</body>
</html>
