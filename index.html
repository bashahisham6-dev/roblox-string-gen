<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roblox 64 - Image String Converter</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0;
            background-color: #aae5a5; 
            color: #222; 
        }
        .box { 
            background: #ffffff; 
            padding: 30px; 
            border-radius: 12px; 
            text-align: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            width: 340px;
        }
        h3 { margin-top: 0; color: #111; }
        .control-group { margin: 15px 0; text-align: left; }
        label { font-weight: bold; display: block; margin-bottom: 5px; font-size: 14px; }
        select, input[type="file"] { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        textarea { width: 100%; height: 100px; margin-top: 15px; box-sizing: border-box; resize: none; border: 1px solid #ccc; border-radius: 4px; padding: 8px; font-family: monospace; font-size: 11px; }
        button { width: 100%; margin-top: 15px; padding: 12px; font-weight: bold; background-color: #222; color: #fff; border: none; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background-color: #444; }
    </style>
</head>
<body>

<div class="box">
    <h3>Roblox 64</h3>
    
    <div class="control-group">
        <label for="sizePicker">resolution:</label>
        <select id="sizePicker">
            <option value="32">32 x 32 (low res, high performance)</option>
            <option value="64" selected>64 x 64 (normal)</option>
            <option value="128">128 x 128 (medium res, medium performance)</option>
            <option value="256">256 x 256 (high res, low performance)</option>
            <option value="512">512 x 512 (highest res, lowest performance)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="imageInput">upload picture:</label>
        <input type="file" id="imageInput" accept="image/*">
    </div>

    <textarea id="output" placeholder="Your formatted string will appear here..." readonly></textarea>
    <button id="copyBtn">copy string</button>
</div>

<script>
    const imageInput = document.getElementById('imageInput');
    const sizePicker = document.getElementById('sizePicker');
    const output = document.getElementById('output');
    const copyBtn = document.getElementById('copyBtn');

    function processImage() {
        const file = imageInput.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');

                const size = parseInt(sizePicker.value); 
                canvas.width = size;
                canvas.height = size;

                ctx.drawImage(img, 0, 0, size, size);

                const imgData = ctx.getImageData(0, 0, size, size).data;
                let pixelStrings = [];

                for (let i = 0; i < imgData.length; i += 4) {
                    const r = imgData[i];
                    const g = imgData[i+1];
                    const b = imgData[i+2];
                    pixelStrings.push(`${r},${g},${b}`);
                }

                // Generates the explicit size tag prefix without trailing characters
                output.value = `${size}|` + pixelStrings.join(';');
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(file);
    }

    imageInput.addEventListener('change', processImage);
    sizePicker.addEventListener('change', processImage);

    copyBtn.addEventListener('click', () => {
        if (!output.value) return;
        output.select();
        document.execCommand('copy');
        alert('string copied');
    });
</script>

</body>
</html>
